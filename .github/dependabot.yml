version: 2

# Catch-all groups: every ecosystem opens at most one version PR and one
# security PR. Security stays separate so an advisory fix is never held up
# behind a routine bump that fails CI.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Actions are SHA-pinned; without this, pinning becomes freezing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
