name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt into more where they need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Actions are pinned by commit SHA: tags are mutable, so pinning to one trusts
# its owner not to move it (OpenSSF Scorecard "Pinned-Dependencies").
jobs:
  # ── Lint & Format ──────────────────────────────────────────────
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --all-targets --locked
      # The minimal build drops the YAML parser, so it must still refuse a
      # YAML allowlist by name rather than fail to compile.
      - name: Run tests without optional features
        run: cargo test --all-targets --locked --no-default-features

  # ── Supply Chain ──────────────────────────────────────────────
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  # ── Build & Push Multi-Arch Image ─────────────────────────────
  build-push:
    name: Build & Push Image (${{ matrix.variant }})
    needs: [check, test, supply-chain]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      # Both variants are published independently; one failing should not
      # cancel a release of the other.
      fail-fast: false
      matrix:
        include:
          # The default: bare tags and :latest point here, and it is also
          # reachable by an explicit -minimal tag so a deployment can pin the
          # feature set rather than inherit whichever one is default.
          - variant: minimal
            flavor: latest=true
            alias_flavor: |
              latest=true
              suffix=-minimal,onlatest=true
          # YAML costs 458 KiB and 10 crates, so it is opt-in by tag.
          - variant: full
            flavor: |
              latest=true
              suffix=-yaml,onlatest=true
            alias_flavor: ""
    permissions:
      contents: read
      packages: write
      # attest-build-provenance signs with a short-lived Sigstore certificate
      # issued against this token, so the provenance is bound to this workflow
      # rather than to a key someone has to hold.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/logxel/docker-socket-proxy
          flavor: ${{ matrix.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      # A second tag set for the same image, so the default variant answers to
      # its own name as well as to the bare tags.
      - name: Docker metadata (explicit alias)
        id: alias
        if: matrix.alias_flavor != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/logxel/docker-socket-proxy
          flavor: ${{ matrix.alias_flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Collect tags
        id: tags
        env:
          PRIMARY: ${{ steps.meta.outputs.tags }}
          ALIAS: ${{ steps.alias.outputs.tags }}
        run: |
          {
            echo 'value<<TAGS_EOF'
            printf '%s\n%s\n' "$PRIMARY" "$ALIAS" | grep -v '^[[:space:]]*$'
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            VARIANT=${{ matrix.variant }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          # Scoped per variant: a shared scope would have each build evict the
          # other's layers, since the feature set changes the dependency graph
          # and so every cargo layer after it.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Attests the manifest digest rather than a tag, since tags move.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/logxel/docker-socket-proxy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
