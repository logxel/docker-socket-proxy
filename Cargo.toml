[package]
name = "docker-socket-proxy"
version = "0.2.0"
edition = "2024"
description = "A secure, minimal Docker socket proxy that filters dangerous API endpoints"
license = "MIT"
repository = "https://github.com/grupo-farinter-oss/docker-socket-proxy"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyperlocal-next = "0.9"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["timeout"] }
toml = "0.8"
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
