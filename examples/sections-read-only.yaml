# Section-style grants as an allowlist file, in YAML.
#
# This is close to `CONTAINERS=1 IMAGES=1 NETWORKS=1 VOLUMES=1` with POST off,
# but not identical: a file is merged over the selected profile, so the default
# profile's own read grants (`/info`, `/version`, `/_ping`) still apply. Use the
# section variables themselves — see `compose/tecnativa-compat.yml` — where the
# policy has to be exactly what is written and nothing more.

include:
  methods:
    - GET
    - HEAD
  endpoints:
    # A trailing `/` means prefix; the bare form matches the collection itself.
    - /containers
    - /containers/
    - /images
    - /images/
    - /networks
    - /networks/
    - /volumes
    - /volumes/

exclude:
  # Prefix grants reach these, and both hand back more than an inspection
  # client needs: process lists and full environment variables.
  endpoints:
    - /containers/*/top
    - /containers/*/changes
